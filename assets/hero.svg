<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Ali Novruz — Backend Engineer. Java, Kotlin, Spring, Kafka, PostgreSQL, Kubernetes.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0D1117"/>
      <stop offset="55%"  stop-color="#0F1420"/>
      <stop offset="100%" stop-color="#141A2E"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#39D0D8"/>
      <stop offset="45%"  stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#A371F7"/>
    </linearGradient>

    <linearGradient id="fadeRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58A6FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowA" cx="50%" cy="50%">
      <stop offset="0%"   stop-color="#58A6FF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%">
      <stop offset="0%"   stop-color="#A371F7" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#8B949E" fill-opacity="0.14"/>
    </pattern>

    <clipPath id="round"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <ellipse cx="90"   cy="30"  rx="460" ry="280" fill="url(#glowA)"/>
    <ellipse cx="1110" cy="300" rx="440" ry="270" fill="url(#glowB)"/>

    <!-- ── event-driven topology: edges ── -->
    <g stroke="url(#accent)" stroke-opacity="0.38" stroke-width="1.4" fill="none" stroke-linecap="round">
      <path d="M800,95 L930,62"/>
      <path d="M930,62 L1075,105"/>
      <path d="M800,95 L855,210"/>
      <path d="M855,210 L985,168"/>
      <path d="M985,168 L1075,105"/>
      <path d="M985,168 L1105,235"/>
      <path d="M1075,105 L1105,235"/>
      <path d="M800,95 L985,168"/>
    </g>

    <!-- ── messages in flight ── -->
    <g fill="#39D0D8">
      <circle r="3.2"><animateMotion dur="2.6s" repeatCount="indefinite" path="M800,95 L930,62"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle r="3.2"><animateMotion dur="3.1s" begin="0.5s" repeatCount="indefinite" path="M930,62 L1075,105"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.1s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle r="3.2" fill="#A371F7"><animateMotion dur="3.4s" begin="0.9s" repeatCount="indefinite" path="M800,95 L855,210"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.4s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle r="3.2" fill="#58A6FF"><animateMotion dur="2.9s" begin="1.4s" repeatCount="indefinite" path="M855,210 L985,168"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="2.9s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle r="3.2" fill="#A371F7"><animateMotion dur="3.6s" begin="0.2s" repeatCount="indefinite" path="M985,168 L1105,235"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.6s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle r="3.2" fill="#58A6FF"><animateMotion dur="3.2s" begin="1.9s" repeatCount="indefinite" path="M800,95 L985,168"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="1.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- ── nodes ── -->
    <g>
      <g transform="translate(800,95)">
        <circle r="6" fill="#39D0D8" fill-opacity="0.18" stroke="#39D0D8" stroke-width="1.6"/>
        <circle r="6" fill="none" stroke="#39D0D8" stroke-width="1.2">
          <animate attributeName="r" values="6;17" dur="3s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0.7;0" dur="3s" repeatCount="indefinite"/></circle>
      </g>
      <g transform="translate(930,62)">
        <circle r="5" fill="#58A6FF" fill-opacity="0.18" stroke="#58A6FF" stroke-width="1.6"/>
        <circle r="5" fill="none" stroke="#58A6FF" stroke-width="1.2">
          <animate attributeName="r" values="5;15" dur="3s" begin="0.6s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0.7;0" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
      </g>
      <g transform="translate(1075,105)">
        <circle r="7" fill="#A371F7" fill-opacity="0.18" stroke="#A371F7" stroke-width="1.6"/>
        <circle r="7" fill="none" stroke="#A371F7" stroke-width="1.2">
          <animate attributeName="r" values="7;19" dur="3s" begin="1.2s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0.7;0" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
      </g>
      <circle cx="855"  cy="210" r="5" fill="#58A6FF" fill-opacity="0.18" stroke="#58A6FF" stroke-width="1.6"/>
      <circle cx="985"  cy="168" r="6" fill="#39D0D8" fill-opacity="0.18" stroke="#39D0D8" stroke-width="1.6"/>
      <circle cx="1105" cy="235" r="5" fill="#A371F7" fill-opacity="0.18" stroke="#A371F7" stroke-width="1.6"/>
    </g>

    <!-- ── type ── -->
    <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text x="72" y="80" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
            font-size="13.5" fill="#6E7681" letter-spacing="0.4">// distributed systems that survive failure</text>

      <text x="70" y="158" font-size="64" font-weight="700" fill="#E6EDF3" letter-spacing="1.5">Ali Novruz</text>

      <rect x="74" y="180" width="132" height="3" rx="1.5" fill="url(#fadeRule)"/>

      <text x="74" y="216" font-size="16.5" font-weight="600" fill="#58A6FF" letter-spacing="5.2">BACKEND ENGINEER</text>

      <text x="74" y="250" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
            font-size="14.5" fill="#8B949E" letter-spacing="0.2">Java · Kotlin · Spring · Kafka · PostgreSQL · Kubernetes</text>
    </g>

    <rect y="314" width="1200" height="6" fill="url(#accent)"/>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#30363D" stroke-width="1"/>
</svg>
