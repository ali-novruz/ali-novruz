<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 6" width="1200" height="6" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#39D0D8" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#39D0D8" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#58A6FF" stop-opacity="0.95"/>
      <stop offset="82%"  stop-color="#A371F7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect y="2" width="1200" height="2" rx="1" fill="url(#d)"/>
  <rect y="2" width="220" height="2" rx="1" fill="url(#sheen)" opacity="0.5">
    <animate attributeName="x" values="-220;1200" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
